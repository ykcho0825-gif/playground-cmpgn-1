apiVersion: diy.platform.io/v1alpha1
kind: DiyConfig
metadata:
  name: campaign-dashboard0-v2-4
  title: campaign-dashboard0-v2-4
  annotations:
    pg.io/icon: 🚀
spec:
  # 앱 생명주기 상태: active, suspended, deprecated, deleted
  lifecycle: active

  # Project 설정
  project:
    category: service
    type: react
    language: javascript
    framework: react
    version: 19.2.4
    description:  "미디어 타겟 마케팅 실적 조회용 대시보드"

  # 빌드 설정
  build:
    runtime: nodejs
    version: 24-trixie-slim
    port: 8080
    # Health Check
    healthCheck:
      liveness:
        path: /healthz
        port: 8080
        initialDelaySeconds: 30
        periodSeconds: 10
      readiness:
        path: /ready
        port: 8080
        initialDelaySeconds: 10
        periodSeconds: 5
  # Frontend/SPA 전용 설정
  frontend:
    buildOutput: dist
    buildCommand: npm run build

  # 배포 설정
  deploy:
    environment: dev
    replicas: 1
    strategy: Recreate
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
    ingress:
      enabled: true
      path: /

    # 환경 변수
    env:
      # - name: EXAMPLE_ENV
      #   value: "example-value"
    secrets:
      - secretName: ldas-credentials
      - secretName: ldas-db-credentials