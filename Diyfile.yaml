apiVersion: diy.platform.io/v1alpha1
kind: DiyConfig
metadata:
  name: campaign-dashboard-v2-3
  title: campaign-dashboard-v2-3
  annotations:
    pg.io/icon: "\U0001F3AF"
spec:
  # 앱 생명주기 상태: active, suspended, deprecated, deleted
  lifecycle: active
  # Project 설정
  project:
    category: service
    type: service
    language: javascript
    framework: express
    version: 4.18.2
    description: "미디어 타겟 마케팅 실적을 조회하는 대시보드입니다"
  # 빌드 설정
  build:
    runtime: nodejs
    version: 20-alpine
    port: 3000
    entrypoint: ["node", "server.js"]
  # 배포 설정
  deploy:
    environment: dev
    replicas: 1
    strategy: Recreate
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    ingress:
      enabled: true
      path: /
    # 환경 변수
    env:
    # - name: EXAMPLE_ENV
    #   value: "example-value"
    secrets:
      - secretName: ldas-credentials
